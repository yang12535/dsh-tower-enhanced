name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Test and check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.5
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Check
        run: pnpm run check
