name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test and check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.5, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Smoke test tower-doctor script
        shell: bash
        run: |
          set -euo pipefail
          # --help must exit 0 (CLI entry + arg parsing intact).
          node scripts/tower-doctor.mjs --help > /dev/null
          # A fresh CI checkout has no .dsh-tower/state.json, so the doctor
          # reports STATE_MISSING and exits 2 — no tower state is expected.
          # Accept 0 (state found, clean) or 2; exit 1 (warnings) fails.
          node scripts/tower-doctor.mjs --repo . || [ $? -eq 2 ]

      - name: Smoke test release script
        shell: bash
        run: |
          set -euo pipefail
          # --help must exit 0 (CLI entry + arg parsing intact).
          node scripts/release.mjs --help > /dev/null
          # "<current>-smoke" is a valid semver prerelease of the current
          # version, so it must be rejected (version not greater). If the
          # dry run unexpectedly succeeds, the version guard is broken.
          if node scripts/release.mjs --version "$(node -p "require('./package.json').version")-smoke"; then
            echo "release.mjs accepted a non-incrementing version" >&2
            exit 1
          fi

      - name: Check
        run: pnpm run check
